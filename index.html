<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Thử thách IQ – Chỉ 1% vượt qua!</title>
  <meta property="og:title" content="Thử thách IQ – Bạn có đủ thông minh?" />
  <meta property="og:description" content="Chỉ 1% người có thể vượt qua tất cả các câu hỏi này!" />
  <meta property="og:image" content="https://i.imgur.com/yX9y9Vr.png" />
  <meta property="og:url" content="https://yourdomain.com/quiz.html" />
  <meta property="og:type" content="website" />

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .quiz-box {
      background: #fff;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      max-width: 600px;
      width: 90%;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    .question {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin: 5px 0;
    }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      font-size: 1.1em;
      background-color: #4caf50;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    button:hover {
      background-color: #388e3c;
    }
  </style>
</head>
<body>

  <div class="quiz-box">
    <h2>Thử thách IQ – 4 câu hỏi</h2>

    <div class="question">
      <p>1. 2 + 2 = ?</p>
      <label><input type="radio" name="q1"> 3</label>
      <label><input type="radio" name="q1"> 4</label>
      <label><input type="radio" name="q1"> 5</label>
    </div>

    <div class="question">
      <p>2. Trái đất quay quanh:</p>
      <label><input type="radio" name="q2"> Mặt trăng</label>
      <label><input type="radio" name="q2"> Mặt trời</label>
      <label><input type="radio" name="q2"> Sao Hỏa</label>
    </div>

    <div class="question">
      <p>3. Đâu là động vật có vú?</p>
      <label><input type="radio" name="q3"> Cá mập</label>
      <label><input type="radio" name="q3"> Cá heo</label>
      <label><input type="radio" name="q3"> Cá voi</label>
    </div>

    <div class="question">
      <p>4. Ngôn ngữ nào phổ biến nhất thế giới?</p>
      <label><input type="radio" name="q4"> Tiếng Trung</label>
      <label><input type="radio" name="q4"> Tiếng Anh</label>
      <label><input type="radio" name="q4"> Tiếng Tây Ban Nha</label>
    </div>

    <button onclick="submitQuiz()">Gửi kết quả</button>
  </div>

  <script>
    function submitQuiz() {
      window.location.href = "https://www.youtube.com/watch?v=dQw4w9WgXcQ";
    }
  </script>

</body>
</html>
